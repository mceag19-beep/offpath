[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offpath"
version = "0.1.0"
description = "OffPath: local developer debugging evidence engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["coverage>=7.0"]
keywords = ["debugging", "testing", "pytest", "coverage", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Debuggers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7.0", "build"]

[project.scripts]
offpath = "offpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_offpath"]
